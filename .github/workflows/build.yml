name: Build SouthWest-NG + KernelSU-Next (clover)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: SouthWest-NG branch or commit
        default: main-legacy
      ksun_ref:
        description: KernelSU-Next branch, tag or commit
        default: legacy
  push:
    branches: [main]
    paths: ['config/**', '.github/workflows/**', 'patches/**', 'scripts/**']
  # Daily: rebuild only if pix106's branch or KernelSU-Next legacy moved (e.g.
  # pix106 merging a new CIP tag), so upstream fixes land without manual work.
  schedule:
    - cron: '23 2 * * *'

env:
  KERNEL_REPO: https://github.com/pix106/android_kernel_xiaomi_sdm660_southwest-ng
  KERNEL_REF: ${{ inputs.kernel_ref || 'main-legacy' }}
  KSUN_REF: ${{ inputs.ksun_ref || 'legacy' }}
  # The exact compiler pix106 used for 0.23.0-legacy (see /proc/config.gz CC_VERSION_TEXT).
  CLANG_BRANCH: android16-qpr2-release
  CLANG_DIR: clang-r563880c

jobs:
  # Decides whether a scheduled run has anything new to build. Push and manual
  # runs always build.
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.heads.outputs.key }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: heads
        run: |
          k=$(git ls-remote "$KERNEL_REPO" "refs/heads/$KERNEL_REF" | cut -c1-12)
          s=$(git ls-remote https://github.com/KernelSU-Next/KernelSU-Next "refs/heads/$KSUN_REF" | cut -c1-12)
          echo "pix106 $KERNEL_REF @ $k, KernelSU-Next $KSUN_REF @ $s"
          echo "key=upstream-${k}-${s}" >> "$GITHUB_OUTPUT"
      - id: seen
        uses: actions/cache/restore@v4
        with:
          path: .upstream-built
          key: ${{ steps.heads.outputs.key }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "${{ steps.seen.outputs.cache-hit }}" = true ]; then
            echo "already built ${{ steps.heads.outputs.key }}"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: upstream
    if: needs.upstream.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline: same toolchain and config, no KernelSU. Proves the build itself boots.
          - variant: noksu
            fragments: config/common.fragment
          # KernelSU-Next with CFI violations logged instead of panicking (diagnostic).
          - variant: ksu-cfiperm
            fragments: config/common.fragment config/ksun.fragment config/cfi-permissive.fragment
          # KernelSU-Next with strict CFI (the intended final build).
          - variant: ksu
            fragments: config/common.fragment config/ksun.fragment
    steps:
      - uses: actions/checkout@v4

      # Runner apt mirrors occasionally hang; bound each attempt and retry.
      - name: Install host packages
        timeout-minutes: 12
        run: |
          pkgs="bc bison flex libssl-dev libelf-dev cpio git zip lz4 python3 device-tree-compiler binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi"
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $i failed or timed out, retrying"
            sleep 10
          done
          exit 1

      - name: Fetch AOSP ${{ env.CLANG_DIR }} (${{ env.CLANG_BRANCH }})
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout --depth=1 -b "$CLANG_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 aosp-clang
          git -C aosp-clang sparse-checkout set --no-cone "/$CLANG_DIR/"
          git -C aosp-clang checkout -q
          echo "$PWD/aosp-clang/$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "aosp-clang/$CLANG_DIR/bin/clang" --version | head -1

      - name: Clone SouthWest-NG (${{ env.KERNEL_REF }})
        run: |
          git clone --depth=1 -b "$KERNEL_REF" "$KERNEL_REPO" kernel \
            || { git clone "$KERNEL_REPO" kernel && git -C kernel checkout "$KERNEL_REF"; }
          git -C kernel log -1 --format='%H %s' | tee kernel-commit.txt

      - name: Add KernelSU-Next (${{ env.KSUN_REF }})
        if: matrix.variant != 'noksu'
        working-directory: kernel
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh | bash -s "$KSUN_REF"
          git -C KernelSU-Next log -1 --format='%H %s' | tee ../ksun-commit.txt
          test -L drivers/kernelsu

      - name: Apply patches
        working-directory: kernel
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in ../patches/kernel/*.patch; do echo "kernel: $p"; git apply --verbose "$p"; done
          if [ -d KernelSU-Next ]; then
            for p in ../patches/ksun/*.patch; do echo "KernelSU-Next: $p"; git -C KernelSU-Next apply --verbose "../$p"; done
            # KernelSU-Next's Kbuild sed-edits kernel sources mid-build (races with -j);
            # apply those backports up front so it finds them already present.
            python3 ../scripts/prepatch_ksun_backports.py
          fi
          git diff --stat

      - name: Configure (${{ matrix.variant }})
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p out
          cp ../config/running-0.23.0-legacy.config out/.config
          for f in ${{ matrix.fragments }}; do echo "# --- $f" >> out/.config; cat "../$f" >> out/.config; done
          echo 'CONFIG_LOCALVERSION="-SouthWest-NG-0.23.0-legacy-${{ matrix.variant }}"' >> out/.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang olddefconfig
          echo "--- resulting options ---"
          grep -E '^(# )?CONFIG_(KSU[A-Z_]*|TCP_CONG_BBR|NET_SCH_FQ_CODEL|LOCALVERSION|LTO_CLANG|CFI_CLANG|CFI_PERMISSIVE|KPROBES)[ =]' out/.config
          python3 - "${{ matrix.fragments }}" <<'EOF'
          import sys, re
          cfg = set(l.strip() for l in open('out/.config'))
          missing = []
          for frag in sys.argv[1].split():
              for line in open('../' + frag):
                  line = line.strip()
                  if re.match(r'^CONFIG_\w+=', line) or re.match(r'^# CONFIG_\w+ is not set$', line):
                      if line not in cfg:
                          missing.append(f'{frag}: {line}')
          if missing:
              print('::error::options that did not survive olddefconfig:\n' + '\n'.join(missing))
              sys.exit(1)
          print('all fragment options applied')
          EOF

      - name: Build
        working-directory: kernel
        run: |
          set -o pipefail
          # -k: report every compile error in one run instead of stopping at the first
          make -k -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb 2>&1 | tee ../build.log
          ls -l out/arch/arm64/boot/

      - name: Sanity-check the kernel image
        working-directory: kernel
        run: |
          set -euo pipefail
          if grep -E 'KSU_NEXT: (adding|patching)' ../build.log; then
            echo "::error::KernelSU-Next edited kernel sources mid-build; objects may disagree. Extend scripts/prepatch_ksun_backports.py."
            exit 1
          fi
          strings out/vmlinux | grep -m1 'Linux version'
          if [ "${{ matrix.variant }}" != noksu ]; then
            strings out/vmlinux | grep -m3 -i 'kernelsu' || { echo "::error::no KernelSU strings in vmlinux"; exit 1; }
            grep -E 'KernelSU-Next version' ../build.log | tail -1
          fi

      - name: Repack stock LineageOS boot.img with the new kernel
        run: |
          set -euo pipefail
          git clone -q --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          stock=$(ls stock/*.img | head -1)
          python3 mkbootimg/unpack_bootimg.py --boot_img "$stock" --out unpacked --format mkbootimg > mkargs.txt
          eval "set -- $(cat mkargs.txt)"
          python3 mkbootimg/mkbootimg.py "$@" --kernel kernel/out/arch/arm64/boot/Image.gz-dtb --output "boot-${{ matrix.variant }}.img"
          python3 mkbootimg/unpack_bootimg.py --boot_img "boot-${{ matrix.variant }}.img" --out check >/dev/null
          cmp unpacked/ramdisk check/ramdisk && echo "ramdisk preserved"
          ls -l "$stock" "boot-${{ matrix.variant }}.img"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "boot-${{ matrix.variant }}.img" dist/
          cp kernel/out/arch/arm64/boot/Image.gz-dtb dist/
          cp kernel/out/.config dist/kernel.config
          cp kernel/out/System.map dist/ 2>/dev/null || true
          cp kernel-commit.txt build.log dist/
          [ -f ksun-commit.txt ] && cp ksun-commit.txt dist/ || true
          (cd dist && sha256sum "boot-${{ matrix.variant }}.img" Image.gz-dtb > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clover-southwest-ng-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            dist/
            build.log
          if-no-files-found: warn

      # Remember this upstream pair as built, so the daily check skips it.
      - name: Mark upstream as built
        if: success() && matrix.variant == 'ksu'
        run: echo "${{ needs.upstream.outputs.key }}" > .upstream-built
      - uses: actions/cache/save@v4
        if: success() && matrix.variant == 'ksu'
        continue-on-error: true
        with:
          path: .upstream-built
          key: ${{ needs.upstream.outputs.key }}
